# Production server overrides, on top of docker-compose.yml and docker-compose.prod.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f deploy/docker-compose.server.yml up -d
# Adds what the server needs and the laptop does not: Caddy (HTTPS) in front of web, and the
# Temporal server with its worker. Only Caddy publishes ports; Docker bypasses ufw, so nothing
# else may. Relative paths resolve against the project directory (the repository root layout).

services:
  # web is reached only through Caddy.
  web:
    ports: !reset []

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN to the site domain, e.g. realty-catalog.site}
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3.
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account: losing them means re-issuing (Let's Encrypt rate limits).
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      web:
        condition: service_healthy

  # Single-node dev server with a SQLite file: enough for four cron workflows.
  temporal:
    image: temporalio/temporal:1.9.1
    restart: unless-stopped
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --headless
      - --db-filename
      - /home/temporal/realty.db
    volumes:
      # The image's home directory belongs to the temporal user, so a fresh volume does too.
      - temporaldata:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # api image, Temporal worker entry point. Its cleanup task deletes orphaned photos, hence uploads.
  temporal-worker:
    extends:
      file: docker-compose.yml
      service: worker
    restart: unless-stopped
    build: !reset null
    image: ${IMAGE_REGISTRY:-}realty-api:${IMAGE_TAG:?set IMAGE_TAG to the commit hash of the images}
    command: !override ["node", "dist/temporal/worker.js"]
    environment:
      NODE_ENV: production
    volumes: !override
      - uploads:/app/uploads
    depends_on:
      temporal:
        condition: service_healthy

volumes:
  caddydata:
  caddyconfig:
  temporaldata:
