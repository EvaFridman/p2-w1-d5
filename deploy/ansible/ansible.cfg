# Run from this directory: ansible-playbook base.yml (see deploy/README.md).
[defaults]
inventory = inventory.ini
interpreter_python = auto_silent
# Secrets live in group_vars/prod/vault.yml (untracked); its password comes from the macOS keychain.
vault_password_file = vault-pass.sh

[ssh_connection]
# The host alias, user and key come from ~/.ssh/config (Host realty).
pipelining = True
