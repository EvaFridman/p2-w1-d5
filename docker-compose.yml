# Development setup: images built from source, code mounted in, auto-reload on change,
# service ports published on localhost, broker UI available.
# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml (see README.md).
# Values come from .env next to this file (not in git); see .env.example.
# Containers reach each other by service name. Temporal is not part of compose (see README.md).

name: realty

x-api-env: &api-env
  NODE_ENV: development
  PORT: 3000
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
  # Temporal runs outside compose, on the host by default.
  TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-host.docker.internal:7233}
  # Server-to-server address of web (revalidation).
  WEB_URL: http://web:3001
  # Public address of the site, used in links that reach the browser.
  # web forwards /files/* and /static/* to api, so avatars load through port 3001.
  PUBLIC_URL: ${SITE_URL}
  CLIENT_URL: ${CLIENT_URL}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  ACCESS_TTL: ${ACCESS_TTL}
  REFRESH_TTL: ${REFRESH_TTL}
  REVALIDATE_SECRET: ${REVALIDATE_SECRET}
  NEXT_BUILD_SECRET: ${NEXT_BUILD_SECRET}
  MAIL_TRANSPORT: ${MAIL_TRANSPORT}
  MAIL_FROM: ${MAIL_FROM}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASS: ${SMTP_PASS}
  PAGE_SIZE_DEFAULT: ${PAGE_SIZE_DEFAULT}
  PAGE_SIZE_MAX: ${PAGE_SIZE_MAX}
  LOG_LEVEL: ${LOG_LEVEL}
  # Used only by `prisma db seed` (see README.md).
  SEED_PASSWORD: ${SEED_PASSWORD}

# Source mounted into api and worker; the anonymous volume keeps the Prisma client
# generated in the image instead of the host's copy.
x-api-dev-volumes: &api-dev-volumes
  - uploads:/app/uploads
  - ./api/src:/app/src
  - /app/src/generated

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.10.2-trixie
    volumes:
      # Redis writes its snapshots (dump.rdb) to /data.
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      # redis-cli exits 0 even on an error reply (e.g. LOADING), so check for PONG.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5673}:5672"
      # Management UI.
      - "127.0.0.1:${RABBITMQ_UI_HOST_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ./api
      # Dev stage: dev dependencies, the Nest CLI for watch mode and ps (see api/Dockerfile).
      target: dev
    image: realty-api:dev
    command: ["npm", "run", "start:dev"]
    environment: *api-env
    volumes: *api-dev-volumes
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    healthcheck:
      # /health/live does not touch dependencies: an unavailable database is not a dead process.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      # Watch mode compiles before it starts listening.
      start_period: 60s
    depends_on: &infra-healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    # Same image as api, different entry point: consumes RabbitMQ and sends mail.
    # No HTTP port, so no healthcheck; nothing depends on it.
    build:
      context: ./api
      target: dev
    image: realty-api:dev
    command: ["npx", "nest", "start", "--watch", "--entryFile", "worker"]
    environment: *api-env
    volumes: *api-dev-volumes
    depends_on: *infra-healthy

  web:
    build:
      context: ./web
      # next dev needs no prerender, so the dev image skips `next build`.
      target: deps
    image: realty-web:dev
    command: ["npx", "next", "dev", "-p", "3001", "-H", "0.0.0.0"]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SITE_URL: ${SITE_URL}
      NEXT_PUBLIC_API_BASE_URL: ${SITE_URL}
      API_URL: http://api:3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      NEXT_BUILD_SECRET: ${NEXT_BUILD_SECRET}
    volumes:
      - ./web/app:/app/app
      - ./web/src:/app/src
      - ./web/public:/app/public
    ports:
      - "3001:3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      # next dev compiles a page on its first request.
      timeout: 30s
      retries: 3
      start_period: 120s
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:
