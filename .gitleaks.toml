# gitleaks config: default rules plus reviewed false positives.
# Add an allowlist entry only for a value confirmed not to be a secret, never to silence a real one.

[extend]
useDefault = true

# Default rules miss credentials inside connection URLs (DATABASE_URL, RABBITMQ_URL, ...).
# Entropy and the allowlist skip placeholders such as `password` or `${POSTGRES_PASSWORD}`.
[[rules]]
id = "connection-url-password"
description = "Password inside a database, broker or cache connection URL"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|rediss?|amqps?)://[^:/\s@]*:([^@\s/]+)@'''
secretGroup = 1
entropy = 3.0
keywords = ["://"]

[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^\$\{?[A-Za-z_][A-Za-z0-9_]*\}?$''']

[[allowlists]]
description = "NestJS starter README: placeholder token in the CircleCI badge URL"
condition = "AND"
paths = ['''^api/README\.md$''']
regexTarget = "match"
regexes = ['''token=abc123def456''']
