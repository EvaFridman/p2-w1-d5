name: CI Quality Assurance

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan git history for secrets (gitleaks)
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --verbose

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies (with peer deps bypass)
        run: npm ci --prefix api --legacy-peer-deps

      - name: Install Web dependencies
        run: npm ci --prefix web

      - name: Generate Prisma Client (CI Environment)
        run: npm --prefix api run postinstall

      - name: Run ESLint (Backend & Frontend)
        run: |
          npm run lint:api
          npm run lint:web

      - name: Run Stylelint (Styles Frontend)
        run: npm --prefix web run lint:css

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run API Unit Tests
        run: npm run test:api

  images:
    # Builds the production images on every PR and push; publishes only after a merge into main.
    needs: [secrets, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag and registry
        # ghcr.io needs a lower-case owner; the tag is the short commit hash.
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr "[:upper:]" "[:lower:]")
          echo "IMAGE_REGISTRY=ghcr.io/${owner}/" >> "$GITHUB_ENV"

      - name: Build images and smoke-test the production overlay
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: ./scripts/ci-build-images.sh

      - name: Publish images to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE_REGISTRY}realty-api:${IMAGE_TAG}"
          docker push "${IMAGE_REGISTRY}realty-web:${IMAGE_TAG}"
